name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: GCLPermissionLab
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package, signature, and integrity
        shell: bash
        run: |
          APK="GCLPermissionLab/app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="${APKSIGNER%/apksigner}/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.gcl.permissionlab.installtest'"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GCL-Permission-Lab-debug
          path: GCLPermissionLab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
